[package]
name = "desksync-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DeskSync desktop agent entrypoint. Hosts the Tauri configuration UI (added in a later phase) and runs the headless agent runtime."

[[bin]]
name = "desksync-agent"
path = "src/main.rs"

[dependencies]
desksync-core.workspace = true
desksync-capture.workspace = true
desksync-input.workspace = true
desksync-transport.workspace = true
desksync-media.workspace = true
desksync-backend.workspace = true
desksync-devtools.workspace = true
desksync-ipc.workspace = true
desksync-permissions.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The credential-bootstrap tests write secrets to a throwaway directory.
tempfile = "3"

[features]
# Build the agent with the real capture/input/clipboard backends. Off by
# default so `cargo build` works on headless CI; enabled on macOS/Windows/Linux
# desktop builds: `cargo build -p desksync-agent --features native`.
# Also stores credentials in the OS keychain rather than the file fallback.
native = [
    "desksync-capture/native",
    "desksync-input/native",
    "desksync-media/rtc",
    "desksync-core/os-keychain",
    "desksync-permissions/native",
]
