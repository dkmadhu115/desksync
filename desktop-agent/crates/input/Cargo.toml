[package]
name = "desksync-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Keyboard/mouse/touch input injection abstraction for the DeskSync desktop agent."

[dependencies]
desksync-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true }
# Native input-injection and clipboard backends. Optional; enabled via the
# `native` feature. enigo -> SendInput/CGEvent/uinput; arboard -> NSPasteboard/
# Win clipboard/X11+Wayland.
enigo = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }

[features]
# Enables the real OS input + clipboard backends. Off by default so the crate
# builds and tests headlessly (no display / accessibility permissions needed).
native = ["dep:enigo", "dep:arboard"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
serde_json.workspace = true
