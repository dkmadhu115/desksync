# DeskSync local development stack.
#
# Infrastructure (postgres, redis, coturn) plus all nine Go services. Bring up
# just the infra with:  make dev-infra
# Bring up everything with:  docker compose -f docker/docker-compose.yml up --build
#
# Build context for services is ../backend so the shared pkg module is available.

name: desksync

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &service-env
    ENVIRONMENT: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    DATABASE_URL: postgres://${POSTGRES_USER:-desksync}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-desksync}?sslmode=disable
    REDIS_ADDR: redis:6379
    # JWT signing secrets (auth issues, other services verify access tokens).
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-0123456789}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-0123456789}
    # Signaling ticket secret, shared by session (issuer) and signaling (verifier).
    SIGNALING_TICKET_SECRET: ${SIGNALING_TICKET_SECRET:-dev-signaling-secret-change-me-0123456789}
    SIGNALING_TICKET_TTL: ${SIGNALING_TICKET_TTL:-2m}
    # URL returned to clients so they can reach the signaling WebSocket.
    SIGNALING_PUBLIC_URL: ${SIGNALING_PUBLIC_URL:-ws://localhost:8085/api/v1/signaling/ws}
    # ICE configuration (STUN always; TURN via coturn with time-limited creds).
    STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
    TURN_URLS: ${TURN_URLS:-turn:coturn:3478}
    TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-change-me-turn-secret}
    TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-1h}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desksync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-desksync}
    # Bound to loopback only: services reach it over the compose network by name.
    # Never expose the database to the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desksync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Loopback only — internal services connect via the compose network.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.6-alpine
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-desksync}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-desksync}?sslmode=disable"
      - "up"

  gateway:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: gateway
    environment:
      <<: *service-env
      GATEWAY_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

  auth:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: auth
    environment:
      <<: *service-env
      AUTH_HTTP_ADDR: ":8081"
    # Internal only — public traffic reaches auth through the gateway (:8080).
    ports:
      - "127.0.0.1:8081:8081"

  device:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: device
    environment:
      <<: *service-env
      DEVICE_HTTP_ADDR: ":8082"
    # Internal only — reached through the gateway (:8080).
    ports:
      - "127.0.0.1:8082:8082"

  session:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: session
    environment:
      <<: *service-env
      SESSION_HTTP_ADDR: ":8083"
    # Internal only — reached through the gateway (:8080).
    ports:
      - "127.0.0.1:8083:8083"

  pairing:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: pairing
    environment:
      <<: *service-env
      PAIRING_HTTP_ADDR: ":8084"
    # Internal only — reached through the gateway (:8080).
    ports:
      - "127.0.0.1:8084:8084"

  signaling:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: signaling
    environment:
      <<: *service-env
      SIGNALING_HTTP_ADDR: ":8085"
    ports:
      - "8085:8085"

  relay:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: relay
    environment:
      <<: *service-env
      RELAY_HTTP_ADDR: ":8086"
    # Internal only — reached through the gateway (:8080).
    ports:
      - "127.0.0.1:8086:8086"

  notification:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: notification
    environment:
      <<: *service-env
      NOTIFICATION_HTTP_ADDR: ":8087"
    # Internal only — reached through the gateway (:8080).
    ports:
      - "127.0.0.1:8087:8087"

  monitoring:
    <<: *service-base
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.service
      args:
        SERVICE: monitoring
    environment:
      <<: *service-env
      MONITORING_HTTP_ADDR: ":8088"
    # Internal only — reached through the gateway (:8080).
    ports:
      - "127.0.0.1:8088:8088"

volumes:
  pgdata:
