# Minimal Coturn configuration for local development.
# Production settings (TLS certs, external IP, quotas) are set in Phase 10.

listening-port=3478
fingerprint

# Time-limited credential mechanism: the relay service mints usernames/passwords
# using this shared secret (matches TURN_STATIC_AUTH_SECRET in .env).
use-auth-secret
static-auth-secret=change-me-turn-secret

realm=desksync
# Development only: relay on the container's addresses.
no-tls
no-dtls
# Reasonable safety defaults.
no-multicast-peers
