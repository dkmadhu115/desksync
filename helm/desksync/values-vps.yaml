# DeskSync — single-node k3s deployment override (VPS 200.97.163.131).
#
# Real secrets are NOT stored here; they are injected at install time, e.g.:
#   helm upgrade --install desksync helm/desksync -n desksync --create-namespace \
#     -f helm/desksync/values-vps.yaml \
#     --set-string postgres.auth.password=$PG \
#     --set-string secrets.data.JWT_ACCESS_SECRET=$JA \
#     --set-string secrets.data.JWT_REFRESH_SECRET=$JR \
#     --set-string secrets.data.SIGNALING_TICKET_SECRET=$SG \
#     --set-string secrets.data.TURN_STATIC_AUTH_SECRET=$TN
#
# Images are built on the node and imported into k3s containerd (no registry),
# so pullPolicy is Never and the ref is <repository>/<service>:<tag>.

global:
  image:
    registry: ""
    repository: desksync
    tag: local
    pullPolicy: Never

# Single node: one replica per service, no HPA/PDB/topology spread.
replicaCount: 1
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
topologySpreadConstraints: []

# Traefik (bundled with k3s) terminates TLS for the domain on 443 and routes by
# path: /api/v1/signaling to signaling, everything else to the gateway. The
# certificate is issued by cert-manager over HTTP-01, which needs this host's DNS
# A record pointing here and port 80 reachable.
#
# A domain is not cosmetic: Google refuses to register a redirect URI on a bare
# IP, so federated sign-in is only possible through this host.
ingress:
  enabled: true
  className: traefik
  host: dkmadhutech.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS only: serve this router on the TLS entrypoint alone, so the API and
    # its bearer tokens are never answered in plaintext on port 80. The ACME
    # challenge still works — cert-manager publishes its own short-lived Ingress
    # for that, which is not restricted to an entrypoint.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  tls:
    enabled: true
    secretName: desksync-tls

config:
  environment: production
  logLevel: info
  logFormat: json
  # Through the TLS ingress, so wss:// rather than a bare-IP ws://.
  signalingPublicUrl: wss://dkmadhutech.com/api/v1/signaling/ws
  stunUrls: stun:stun.l.google.com:19302
  turnUrls: turn:200.97.163.131:3478
  turnRealm: desksync

postgres:
  enabled: true
  auth:
    username: desksync
    # Overridden at install time via --set-string postgres.auth.password=...
    password: change-me
    database: desksync
  storage:
    size: 10Gi
    storageClassName: local-path

redis:
  enabled: true

coturn:
  enabled: true
  hostNetwork: true
  externalIP: "200.97.163.131"

migrations:
  enabled: true
  image:
    registry: ""
    repository: desksync
    name: migrations
    tag: local

# Secret placeholders — overridden at install time via --set-string, including
# GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET for Google sign-in.
secrets:
  create: true
  data:
    JWT_ACCESS_SECRET: change-me-access-secret-min-32-bytes
    JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-bytes
    SIGNALING_TICKET_SECRET: change-me-signaling-secret-min-32-bytes
    TURN_STATIC_AUTH_SECRET: change-me-turn-secret

# Also exposed on the node IP (8080 / 8085) via ServiceLB, alongside the ingress.
# Kept so clients pinned to the old http://IP:8080 base URL — an installed APK,
# an agent whose config has not been repointed — keep working during the move to
# the domain.
services:
  gateway:
    serviceType: LoadBalancer
  signaling:
    serviceType: LoadBalancer
