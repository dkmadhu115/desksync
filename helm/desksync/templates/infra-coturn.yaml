{{- if .Values.coturn.enabled }}
# In-cluster TURN/STUN relay (coturn). Uses hostNetwork so the relay and its
# ephemeral media ports are reachable on the node's public IP. Its
# time-limited-credential secret matches the app's TURN_STATIC_AUTH_SECRET.
apiVersion: v1
kind: Service
metadata:
  name: coturn
  labels:
    {{- include "desksync.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
spec:
  type: ClusterIP
  selector:
    {{- include "desksync.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "desksync.fullname" . }}-coturn
  labels:
    {{- include "desksync.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "desksync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coturn
  template:
    metadata:
      labels:
        {{- include "desksync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: coturn
    spec:
      {{- if .Values.coturn.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: coturn
          image: {{ .Values.coturn.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["turnserver"]
          args:
            - "--listening-port=3478"
            - "--fingerprint"
            - "--use-auth-secret"
            - "--static-auth-secret=$(TURN_STATIC_AUTH_SECRET)"
            - "--realm={{ .Values.config.turnRealm }}"
            - "--no-tls"
            - "--no-dtls"
            - "--no-multicast-peers"
            {{- with .Values.coturn.externalIP }}
            - "--external-ip={{ . }}"
            {{- end }}
            {{- range .Values.coturn.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: TURN_STATIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "desksync.secretName" . }}
                  key: TURN_STATIC_AUTH_SECRET
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
          resources:
            {{- toYaml .Values.coturn.resources | nindent 12 }}
{{- end }}
