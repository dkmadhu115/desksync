{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "desksync.secretName" . }}
  labels:
    {{- include "desksync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{- if not (or (eq $key "DATABASE_URL") (eq $key "REDIS_ADDR")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  # DATABASE_URL / REDIS_ADDR are derived so the app, migrations, and in-cluster
  # infra always agree (or fall back to the operator-supplied values).
  DATABASE_URL: {{ include "desksync.databaseUrl" . | quote }}
  REDIS_ADDR: {{ include "desksync.redisAddr" . | quote }}
{{- end }}
