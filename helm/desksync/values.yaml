# Default values for the DeskSync umbrella chart.
# Production installs override image tag, ingress host, and secrets (ideally via
# an external secret manager referenced through secrets.existingSecret).

global:
  image:
    registry: ghcr.io
    # Owner/repo path; per-service images are <registry>/<repository>/<service>.
    repository: dkmadhu115/desksync
    # Empty defaults to Chart.appVersion, so `helm upgrade` pins to the chart.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Default replica count when autoscaling is disabled.
replicaCount: 2

# Non-secret configuration, rendered into a shared ConfigMap and injected into
# every service via envFrom.
config:
  environment: production
  logLevel: info
  logFormat: json
  jwtIssuer: desksync
  # A client stays signed in for jwtRefreshTtl, silently exchanging its refresh
  # token whenever the short-lived access token runs out. jwtAccessTtl therefore
  # bounds how long a revoked account keeps access, not how long a user stays
  # logged in.
  jwtAccessTtl: 1h
  jwtRefreshTtl: 720h
  # Grace period in which a refresh token that was just rotated is still
  # accepted, so a client whose rotation response was lost can retry instead of
  # being logged out as a suspected thief.
  jwtRefreshReuseGrace: 1m
  signalingTicketTtl: 2m
  # Externally reachable signaling WebSocket URL returned to clients.
  signalingPublicUrl: wss://api.desksync.example.com/api/v1/signaling/ws
  turnCredentialTtl: 1h
  turnRealm: desksync
  stunUrls: stun:stun.l.google.com:19302
  turnUrls: turn:turn.desksync.example.com:3478
  otelExporterOtlpEndpoint: ""
  rateLimitRps: "20"
  rateLimitBurst: "40"
  # OAuth callback URLs. Left empty they follow the ingress host, which is what
  # you want: the value has to match the redirect URI registered with Google or
  # GitHub exactly, so deriving it from one place avoids a silent mismatch. Set
  # these only when the provider must call back somewhere else (a proxy in
  # front, or a legacy URI you cannot change).
  googleOauthRedirectUrl: ""
  githubOauthRedirectUrl: ""

# Secrets. In production, provision these through an external secret manager and
# set existingSecret to the resulting Secret name (leaving create=false). For
# demo installs, set create=true and fill data (Helm base64-encodes it).
secrets:
  create: true
  existingSecret: ""
  data:
    DATABASE_URL: "postgres://desksync:change-me@postgres:5432/desksync?sslmode=require"
    REDIS_ADDR: "redis:6379"
    REDIS_PASSWORD: ""
    JWT_ACCESS_SECRET: "change-me-access-secret-min-32-bytes"
    JWT_REFRESH_SECRET: "change-me-refresh-secret-min-32-bytes"
    SIGNALING_TICKET_SECRET: "change-me-signaling-secret-min-32-bytes"
    TURN_STATIC_AUTH_SECRET: "change-me-turn-secret"
    # Federated sign-in. Empty means the provider is simply not offered: the auth
    # service answers /oauth/<provider>/start with "oauth provider not
    # configured". Supply at install time rather than committing them, e.g.
    #   --set-string secrets.data.GOOGLE_OAUTH_CLIENT_ID=... \
    #   --set-string secrets.data.GOOGLE_OAUTH_CLIENT_SECRET=...
    GOOGLE_OAUTH_CLIENT_ID: ""
    GOOGLE_OAUTH_CLIENT_SECRET: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod- and container-level hardening applied to every service. The images are
# distroless/static:nonroot, so these are all satisfiable.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# Default resource requests/limits (per-service overridable under services.*.resources).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread and placement (applied to all services).
nodeSelector: {}
tolerations: []
# Prefer spreading replicas of the same component across nodes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# In-cluster infrastructure. Set enabled=false for any of these to use a
# managed/external equivalent (then supply the matching secrets.data values).
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: desksync
    password: change-me
    database: desksync
  storage:
    size: 10Gi
    # "" uses the cluster default StorageClass (k3s ships local-path).
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: "500m"
      memory: 128Mi

coturn:
  enabled: true
  image: coturn/coturn:4.6-alpine
  # hostNetwork exposes TURN + its media ports directly on the node's public IP.
  hostNetwork: true
  # Public IP advertised to peers; required for TURN relay across the internet.
  externalIP: ""
  extraArgs: []
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: "500m"
      memory: 128Mi

# The nine services. `public: true` places the service behind the ingress at
# `ingressPath`. Set `serviceType: LoadBalancer` (or NodePort) to expose a
# service directly on the node (useful without an ingress controller / on bare
# IPs). Each may override replicas/resources/autoscaling.
services:
  gateway:
    port: 8080
    addrEnv: GATEWAY_HTTP_ADDR
    public: true
    ingressPath: /
  auth:
    port: 8081
    addrEnv: AUTH_HTTP_ADDR
  device:
    port: 8082
    addrEnv: DEVICE_HTTP_ADDR
  session:
    port: 8083
    addrEnv: SESSION_HTTP_ADDR
  pairing:
    port: 8084
    addrEnv: PAIRING_HTTP_ADDR
  signaling:
    port: 8085
    addrEnv: SIGNALING_HTTP_ADDR
    public: true
    ingressPath: /api/v1/signaling
  relay:
    port: 8086
    addrEnv: RELAY_HTTP_ADDR
  notification:
    port: 8087
    addrEnv: NOTIFICATION_HTTP_ADDR
  monitoring:
    port: 8088
    addrEnv: MONITORING_HTTP_ADDR

ingress:
  enabled: true
  className: nginx
  host: api.desksync.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    secretName: desksync-tls

# Database migration Job (Helm pre-install/pre-upgrade hook). The image bundles
# backend/migrations (see docker/Dockerfile.migrations).
migrations:
  enabled: true
  image:
    registry: ghcr.io
    repository: dkmadhu115/desksync
    name: migrations
    tag: ""

# Prometheus Operator integration (requires the CRDs to be installed).
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s

prometheusRule:
  enabled: false

# Restrict traffic: only the ingress controller may reach public services, and
# only in-namespace peers may reach internal ones.
networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
